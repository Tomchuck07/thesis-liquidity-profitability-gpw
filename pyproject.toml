[project]
name = "bachelors-thesis"
version = "0.1.0"
description = "Liquidity vs profitability of GPW retail companies (2019-2024) plus the Polish macro backdrop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.10.5",
    "numpy>=2.0",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "scipy>=1.14",
]

[tool.ruff.lint.isort]
# Without this ruff treats r3_analysis as a third-party package and wants it merged
# into the matplotlib/numpy block. It is our own module and belongs in its own group.
known-first-party = ["r3_analysis"]
